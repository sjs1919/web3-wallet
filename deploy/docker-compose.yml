# web3-wallet 本地开发依赖编排（Nacos / MySQL / Redis）
# 启动：docker compose -f deploy/docker-compose.yml up -d
# 说明：
#   - 本地链 anvil 建议在 WSL 直接用 Foundry 跑（`anvil`，默认 8545），不走容器；如要容器可用 ghcr.io/foundry-rs/foundry
#   - MySQL 默认库 web3_wallet，root 密码用环境变量 DB_PASSWORD 覆盖（默认 root）
version: '3.8'

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: web3-wallet-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: web3-wallet-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: web3_wallet
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: web3-wallet-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql-data:
